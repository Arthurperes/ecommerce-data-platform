name: CI - E-commerce Data Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib streamlit pytest boto3

      - name: Validate Python syntax
        run: |
          python -m py_compile app/gold_processor.py
          python -m py_compile src/train_conversion_propensity.py
          python -m py_compile src/train_customer_profiles.py
          python -m py_compile src/decision_matrix.py
          python -m py_compile dashboard/streamlit_app.py

      - name: Run automated tests
        run: |
          pytest tests -v